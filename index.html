  <button id="purchaseBtn">ACESSAR GRUPO</button>

  <script>
    /* ==============================
       CAPTURA DOS IDS
    ============================== */
    const params = new URLSearchParams(window.location.search);

    // TikTok
    const ttclid = params.get("ttclid");
    if (ttclid) localStorage.setItem("ttclid", ttclid);
    const savedTtclid = ttclid || localStorage.getItem("ttclid");

    // Facebook
    const fbclid = params.get("fbclid");
    if (fbclid) localStorage.setItem("fbclid", fbclid);
    const savedFbclid = fbclid || localStorage.getItem("fbclid");

    /* ==============================
       EVENTO PURCHASE + REDIRECT
    ============================== */
    document.getElementById("purchaseBtn").addEventListener("click", function () {

      // 🔥 TikTok
      ttq.track("CompletePayment", {
        value: 12.90,
        currency: "BRL",
        contents: [{ content_id: "prod001" }],
        external_id: savedTtclid || ""
      });

      // 🔥 Facebook
      fbq('track', 'Purchase', {
        value: 12.90,
        currency: 'BRL',
        content_ids: ['prod001'],
        content_type: 'product'
      });

      // Delay seguro
      setTimeout(() => {
        window.location.href = "https://t.me/+KO_y0i7PbLE1YzNh";
      }, 400);
    });
