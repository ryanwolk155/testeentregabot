  <!-- ===================== -->
  <!-- ESTILO -->
  <!-- ===================== -->
  <style>
    body {
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 20px 40px;
      font-size: 22px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <button id="purchaseBtn">ACESSAR GRUPO</button>

  <script>
    /* ==============================
       CAPTURA E PERSISTÊNCIA DO TTCLID
    ============================== */
    const params = new URLSearchParams(window.location.search);
    const ttclidParam = params.get("ttclid");

    if (ttclidParam) {
      localStorage.setItem("ttclid", ttclidParam);
    }

    const savedTtclid = ttclidParam || localStorage.getItem("ttclid") || "";

    /* ==============================
       EVENTO PURCHASE + REDIRECT
    ============================== */
    const btn = document.getElementById("purchaseBtn");
    let fired = false;

    btn.addEventListener("click", function () {
      if (fired) return;
      fired = true;

      btn.disabled = true;

      // 🔥 EVENTO OFICIAL DE COMPRA
      try {
        ttq.track("Purchase", {
          value: 12.90,
          currency: "BRL",
          contents: [
            {
              content_id: "prod001",
              quantity: 1,
              price: 12.90
            }
          ],
          ttclid: savedTtclid
        });
      } catch (e) {
        console.error("Erro ao disparar evento TikTok:", e);
      }

      // 🚀 Redirect seguro
      setTimeout(() => {
        window.location.href = "https://t.me/+ixSVQhqNf8cwZjU5";
      }, 800);
    });

    /* ==============================
       FALLBACK AUTOMÁTICO (CASO JS FALHE)
    ============================== */
    setTimeout(() => {
      if (!fired) {
        window.location.href = "https://t.me/+ixSVQhqNf8cwZjU5";
      }
    }, 15000);
  </script>

</body>
</html>
